[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
# Correctness-focused gate (pyflakes + pycodestyle errors). Style rules (I, UP) are a later, separate cleanup.
select = ["E4", "E7", "E9", "F"]
ignore = ["E711", "E712"]  # SQLAlchemy needs == None / == True to build SQL
