name: CI

on:
  push:
    branches: [main, "audit/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: souk, POSTGRES_PASSWORD: souk, POSTGRES_DB: souk_test }
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U souk" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (real Postgres migrated by Alembic + Redis)
        run: pytest -q
      - name: Migrations are reversible
        env:
          DATABASE_URL: postgresql+asyncpg://souk:souk@localhost:55432/souk_test
        run: alembic downgrade -1 && alembic upgrade head
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Static security scan
        run: bandit -q -r api core services workers app -ll

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - name: Dependency audit (high+, production deps)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: souk, POSTGRES_PASSWORD: souk, POSTGRES_DB: souk_e2e }
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U souk" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://souk:souk@localhost:55432/souk_e2e
      REDIS_URL: redis://localhost:56379/0
      SECRET_KEY: ci-e2e-secret-key-0123456789abcdef0123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Start backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
      - name: Start frontend
        working-directory: frontend
        run: |
          npm ci
          nohup npx vite --port 5173 --strictPort > /tmp/vite.log 2>&1 &
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 http://localhost:8000/health/ready
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 http://localhost:5173/ > /dev/null
      - name: Playwright (system Chrome) — signup and 2-tap cash sale
        working-directory: frontend
        run: npx playwright test --reporter=line
      - if: failure()
        run: tail -100 /tmp/api.log /tmp/vite.log
