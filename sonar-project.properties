sonar.projectKey=ennajari_souk-ai
sonar.organization=ennajari
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/alembic/versions/**,**/dist/**,.sonar/**,**/scripts/**,**/deploy.py
sonar.python.version=3.11

# Suppress rules that are false positives or impractical for this project
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8

# FastAPI Annotated syntax rules (already using Annotated pattern)
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S6552
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S6548
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.py

# Docker-compose default passwords (using env vars, defaults are dev-only)
sonar.issue.ignore.multicriteria.e3.ruleKey=secrets:S6697
sonar.issue.ignore.multicriteria.e3.resourceKey=docker-compose.yml

# React prop-types (project uses TypeScript-style inference, not PropTypes)
sonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S6774
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.jsx

# window vs globalThis (browser-only code, window is correct here)
sonar.issue.ignore.multicriteria.e5.ruleKey=javascript:S6654
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.js

sonar.issue.ignore.multicriteria.e6.ruleKey=javascript:S6654
sonar.issue.ignore.multicriteria.e6.resourceKey=**/*.jsx

# Service worker self (standard API, not a bug)
sonar.issue.ignore.multicriteria.e7.ruleKey=javascript:S6654
sonar.issue.ignore.multicriteria.e7.resourceKey=**/sw.js

# FastAPI HTTPException documentation (informational only, no impact)
sonar.issue.ignore.multicriteria.e8.ruleKey=python:S6888
sonar.issue.ignore.multicriteria.e8.resourceKey=**/*.py
