<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">

  <!-- Background -->
  <rect width="1024" height="1024" rx="200" fill="#0f172a"/>

  <!-- Hexagon glow fill -->
  <polygon points="512,90 870,300 870,720 512,930 154,720 154,300" fill="#10b981" opacity="0.07"/>

  <!-- Hexagon border -->
  <polygon points="512,90 870,300 870,720 512,930 154,300 154,300"
           fill="none"/>
  <!-- Corrected hexagon border -->
  <polygon points="512,100 862,306 862,718 512,924 162,718 162,306"
           fill="none" stroke="#10b981" stroke-width="6" opacity="0.25"/>

  <!-- Outer neural nodes -->
  <circle cx="512" cy="210" r="38" fill="#10b981" opacity="0.85"/>
  <circle cx="724" cy="640" r="38" fill="#10b981" opacity="0.85"/>
  <circle cx="300" cy="640" r="38" fill="#10b981" opacity="0.85"/>

  <!-- Central hub (ring + core) -->
  <circle cx="512" cy="512" r="72" fill="#10b981"/>
  <circle cx="512" cy="512" r="50" fill="#0f172a"/>
  <circle cx="512" cy="512" r="22" fill="#10b981"/>

  <!-- Lines: outer nodes to center -->
  <line x1="512" y1="210" x2="512" y2="440" stroke="#10b981" stroke-width="12" opacity="0.7" stroke-linecap="round"/>
  <line x1="724" y1="640" x2="578" y2="552" stroke="#10b981" stroke-width="12" opacity="0.7" stroke-linecap="round"/>
  <line x1="300" y1="640" x2="446" y2="552" stroke="#10b981" stroke-width="12" opacity="0.7" stroke-linecap="round"/>

  <!-- Triangle edges (very subtle) -->
  <line x1="512" y1="210" x2="724" y2="640" stroke="#10b981" stroke-width="4" opacity="0.15"/>
  <line x1="512" y1="210" x2="300" y2="640" stroke="#10b981" stroke-width="4" opacity="0.15"/>
  <line x1="724" y1="640" x2="300" y2="640" stroke="#10b981" stroke-width="4" opacity="0.15"/>

</svg>
